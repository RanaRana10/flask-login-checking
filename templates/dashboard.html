<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
</head>

<body>
    <h1>Dashboard</h1>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul style="color:green;">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}

    <p>Welcome to your dashboard!</p>
</body>

</html>
